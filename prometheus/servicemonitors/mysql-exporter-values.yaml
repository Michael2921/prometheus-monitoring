serviceMonitor:
  enabled: true
  namespace: monitoring-ns
  interval: 30s
  additionalLabels:
    release: monitoring-release

  multipleTarget:
    enabled: true
    targets:
      - name: mysql-primary
        endpoint: mysql-release-primary-0.mysql-release-primary-headless.default.svc.cluster.local
        port: 3306
        user: myuser
        password: mypass

      - name: mysql-secondary-0
        endpoint: mysql-release-secondary-0.mysql-release-secondary-headless.default.svc.cluster.local
        port: 3306
        user: myuser
        password: mypass

      - name: mysql-secondary-1
        endpoint: mysql-release-secondary-1.mysql-release-secondary-headless.default.svc.cluster.local
        port: 3306
        user: myuser
        password: mypass




      


